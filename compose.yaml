services:
  papersafe:
    build: .
    environment:
      APP_ENV: development
      PAPERSAFE_DATA_DIR: /data
      PAPERSAFE_HOST: 0.0.0.0
      PAPERSAFE_PORT: 5000
      PAPERSAFE_SEED_DEMO: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - papersafe-data:/data
    restart: unless-stopped

volumes:
  papersafe-data:
