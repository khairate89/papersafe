{% extends "base.html" %}
{% block title %}Log in · PaperSafe{% endblock %}
{% block content %}
<section class="panel narrow">
  <div class="auth-heading">
    <span class="eyebrow">YOUR WORKSPACE</span>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to access your documents.</p>
  </div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username<input id="username" name="username" autocomplete="username" required></label>
    <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button class="button button-full" type="submit">Log in</button>
  </form>
  <p class="auth-switch">New to PaperSafe? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
