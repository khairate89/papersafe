{% extends "base.html" %}
{% block title %}Upload PDF · PaperSafe{% endblock %}
{% block content %}
<section class="panel narrow">
  <div class="auth-heading">
    <span class="eyebrow">DOCUMENT LIBRARY</span>
    <h1>Upload a PDF</h1>
    <p class="muted">Add a document to your workspace. Each PDF can be up to 10 MiB.</p>
  </div>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="title">Document title<input id="title" name="title" maxlength="120" placeholder="e.g. Project proposal"><small>Optional. Up to 120 characters.</small></label>
    <label for="pdf">PDF file<input id="pdf" name="pdf" type="file" accept=".pdf,application/pdf" aria-describedby="pdf-help" required><small id="pdf-help">PDF files only · Maximum 10 MiB per file</small></label>
    <button class="button button-full" type="submit">Upload document</button>
  </form>
</section>
{% endblock %}
